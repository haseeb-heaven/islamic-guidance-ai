<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings – Islamic Guidance AI</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Dark Mode Toggle -->
  <button id="darkModeToggle" class="dark-mode-toggle" aria-label="Toggle dark mode" title="Toggle Dark Mode">
    <span class="moon-icon">🌙</span>
    <span class="sun-icon hidden">☀️</span>
  </button>
  
  <section class="hero">
    <h1>Settings</h1>
    <div class="settings-panel">
      <label for="themeSelect">Theme</label>
      <select id="themeSelect" aria-label="Select theme">
        <option value="modern">Modern Blue</option>
        <option value="traditional" selected>Traditional Islamic</option>
        <option value="minimal">Minimal White</option>
        <option value="dark" disabled hidden>Dark Mode</option>
      </select>
      
      <label for="modelSelect">Gemini AI Model</label>
      <select id="modelSelect" aria-label="Select Gemini model">
        <option value="">Loading models...</option>
      </select>
      <small class="model-info" id="modelInfo">Select a model to see details</small>

      <div class="settings-group">
        <label for="searchLimit">Search Results Limit: <span id="searchLimitValue">3</span></label>
        <input type="range" id="searchLimit" min="1" max="20" value="3" class="slider" aria-label="Search results limit">
      </div>

      <div class="settings-group checkbox-group">
        <input type="checkbox" id="highQualityOnly">
        <label for="highQualityOnly">Hide Irrelevant Results (High Quality Only)</label>
      </div>

      
      <label for="apiKey">Gemini API Key</label>
      <div class="password-input-wrapper">
        <input type="password" id="apiKey" placeholder="Enter your API key" autocomplete="off" />
        <button type="button" id="toggleApiKeyVisibility" class="eye-icon" aria-label="Toggle API key visibility">
          <span class="eye-open">👁️</span>
          <span class="eye-closed hidden">🔒</span>
        </button>
      </div>
      
      <div class="settings-buttons-container">
        <div class="settings-row">
          <button id="saveKeyBtn">SAVE SETTINGS</button>
          <button id="loadSettingsBtn">LOAD SETTINGS</button>
        </div>
        <div class="settings-row">
          <button id="helpBtn">HELP</button>
          <button id="creditsBtn">CREDITS</button>
        </div>
      </div>
    </div>
    <div id="statusMessage" class="status-message hidden"></div>
    
    <!-- Credits Modal -->
    <div id="creditsModal" class="modal hidden">
      <div class="modal-content">
        <span class="close-modal">&times;</span>
        <h2>Credits & Resources</h2>
        <div class="credits-links">
          <a href="https://github.com/fawazahmed0/hadith-api" target="_blank" rel="noopener noreferrer" class="credit-link">Hadith API</a>
          <a href="https://alquran.cloud/api" target="_blank" rel="noopener noreferrer" class="credit-link">Al Quran Cloud</a>
          <a href="https://ai.google.dev/gemini-api/docs" target="_blank" rel="noopener noreferrer" class="credit-link">Gemini API</a>
        </div>
      </div>
    </div>
  </section>
  <script src="settings.js?v=3"></script>
</body>
</html>
